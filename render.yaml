services:
  - type: web
    name: let-him-rook
    runtime: node
    plan: free
    branch: main
    buildCommand: npm install --include=dev && npm run build
    startCommand: node apps/server/src/index.ts
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "24"
    domains:
      - pawnhub.tech
