services:
  - type: web
    name: let-him-rook-server
    runtime: node
    plan: starter
    buildCommand: npm install
    startCommand: node apps/server/src/index.ts
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3001
      - key: ALLOWED_ORIGINS
        value: '*'
